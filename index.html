<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Digital Wardrobe & Outfit Builder</title>
  <style>
    :root {
      --primary: #007AFF;
      --bg: #F2F2F7;
      --card-bg: #FFFFFF;
      --text: #1C1C1E;
      --secondary-text: #8E8E93;
      --border: #E5E5EA;
      --danger: #FF3B30;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }

    header {
      position: sticky; top: 0; background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
      padding: 16px; text-align: center; font-weight: 700; font-size: 1.2rem; z-index: 10;
    }

    .container { padding: 16px; max-width: 500px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Cards */
    .card {
      background: var(--card-bg); border-radius: 14px; padding: 16px;
      margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; }

    /* Form Inputs */
    label { font-size: 0.85rem; color: var(--secondary-text); margin-top: 10px; display: block; }
    input[type="text"], select {
      width: 100%; padding: 12px; border: 1px solid var(--border);
      border-radius: 10px; margin-top: 4px; font-size: 1rem; background: var(--bg);
    }

    /* Custom File Upload Button */
    .file-upload-btn {
      display: block; width: 100%; text-align: center; background: #E5F1FF;
      color: var(--primary); font-weight: 600; padding: 14px; border-radius: 10px;
      border: 2px dashed var(--primary); margin-top: 10px; cursor: pointer;
    }
    input[type="file"] { display: none; }

    /* Image Preview */
    #imagePreview {
      width: 100%; height: 180px; object-fit: cover; border-radius: 10px;
      margin-top: 12px; display: none;
    }

    /* Buttons */
    .btn {
      width: 100%; padding: 14px; background: var(--primary); color: white;
      border: none; border-radius: 10px; font-size: 1rem; font-weight: 600;
      margin-top: 16px; cursor: pointer;
    }
    .btn:active { opacity: 0.8; }

    /* Closet Grid */
    .closet-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .item-card {
      background: var(--card-bg); border-radius: 10px; overflow: hidden;
      border: 1px solid var(--border); position: relative;
    }
    .item-card img { width: 100%; height: 140px; object-fit: cover; }
    .item-info { padding: 8px; }
    .item-title { font-weight: 600; font-size: 0.9rem; }
    .item-tag { font-size: 0.75rem; color: var(--secondary-text); }
    .delete-btn {
      position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.6);
      color: white; border: none; border-radius: 50%; width: 24px; height: 24px;
      font-size: 0.8rem; cursor: pointer;
    }

    /* Outfit Display */
    .outfit-display { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
    .outfit-slot {
      background: var(--card-bg); border-radius: 10px; padding: 12px;
      display: flex; align-items: center; gap: 12px; border: 1px solid var(--border);
    }
    .outfit-slot img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; }
    .outfit-slot-info { flex-grow: 1; }

    /* Bottom Navigation */
    nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg);
      border-top: 1px solid var(--border); display: flex; justify-content: space-around;
      padding: 10px 0 24px; z-index: 10;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center;
      font-size: 0.75rem; color: var(--secondary-text); text-decoration: none;
      border: none; background: none; cursor: pointer; width: 33%;
    }
    .nav-item.active { color: var(--primary); font-weight: 600; }
    .nav-icon { font-size: 1.4rem; margin-bottom: 2px; }
  </style>
</head>
<body>

  <header id="headerTitle">Outfit Generator</header>

  <div class="container">
    
    <!-- TAB 1: OUTFIT GENERATOR -->
    <div id="tab-generator" class="tab-content active">
      <div class="card">
        <div class="card-title">Daily Context</div>
        <label>Weather / Temperature</label>
        <select id="weatherSelect">
          <option value="hot">🔥 Hot (> 75°F / 24°C)</option>
          <option value="mild" selected>🌤️ Mild (60°F - 74°F / 15°C - 23°C)</option>
          <option value="cold">❄️ Cold (< 60°F / 15°C)</option>
        </select>

        <label>Mood / Vibe</label>
        <select id="moodSelect">
          <option value="casual">🛋️ Casual / Relaxed</option>
          <option value="chic">✨ Chic / Stylish</option>
          <option value="formal">💼 Work / Formal</option>
        </select>

        <button class="btn" onclick="generateOutfit()">Get Customized Outfit</button>
      </div>

      <div class="card">
        <div class="card-title">Suggested Outfit</div>
        <div id="outfitResults">
          <p style="color: var(--secondary-text); text-align: center; padding: 20px 0;">Select your context above and tap Generate.</p>
        </div>
      </div>
    </div>

    <!-- TAB 2: MY CLOSET -->
    <div id="tab-closet" class="tab-content">
      <div class="card">
        <div class="card-title" style="display: flex; justify-content: space-between; align-items: center;">
          <span>Wardrobe Collection</span>
          <span id="itemCount" style="font-size: 0.85rem; color: var(--secondary-text);">0 items</span>
        </div>
        <div id="closetGrid" class="closet-grid">
          <!-- Items render here -->
        </div>
      </div>
    </div>

    <!-- TAB 3: UPLOAD CLOTHES -->
    <div id="tab-upload" class="tab-content">
      <div class="card">
        <div class="card-title">Add New Garment</div>
        
        <label>Photo</label>
        <label for="fileInput" class="file-upload-btn">📷 Take Photo or Select File</label>
        <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)">
        <img id="imagePreview" alt="Garment Preview">

        <label>Item Name</label>
        <input type="text" id="itemName" placeholder="e.g., White Denim Jacket">

        <label>Category</label>
        <select id="itemCategory">
          <option value="top">Top (T-shirt, Shirt, Sweater)</option>
          <option value="bottom">Bottom (Pants, Shorts, Skirt)</option>
          <option value="outerwear">Outerwear (Jacket, Coat)</option>
          <option value="shoes">Shoes</option>
        </select>

        <label>Best Weather Suitability</label>
        <select id="itemWeather">
          <option value="hot">Hot Weather Only</option>
          <option value="mild" selected>Mild Weather</option>
          <option value="cold">Cold Weather Only</option>
          <option value="all">All Seasons</option>
        </select>

        <label>Style Vibe</label>
        <select id="itemMood">
          <option value="casual">Casual</option>
          <option value="chic">Chic</option>
          <option value="formal">Formal</option>
        </select>

        <button class="btn" onclick="saveItem()">Save to Closet</button>
      </div>
    </div>

  </div>

  <!-- NAVIGATION BAR -->
  <nav>
    <button class="nav-item active" onclick="switchTab('generator', this)">
      <span class="nav-icon">✨</span>
      <span>Outfits</span>
    </button>
    <button class="nav-item" onclick="switchTab('closet', this)">
      <span class="nav-icon">👕</span>
      <span>Closet</span>
    </button>
    <button class="nav-item" onclick="switchTab('upload', this)">
      <span class="nav-icon">➕</span>
      <span>Add Item</span>
    </button>
  </nav>

  <script>
    // --- APP STATE & STORAGE ---
    let wardrobe = JSON.parse(localStorage.getItem('my_wardrobe_items')) || [];
    let currentBase64Image = '';

    // Load closet on start
    document.addEventListener('DOMContentLoaded', () => {
      renderCloset();
    });

    // --- TAB SWITCHING ---
    function switchTab(tabName, el) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));

      document.getElementById(`tab-${tabName}`).classList.add('active');
      el.classList.add('active');

      const titles = { 'generator': 'Outfit Generator', 'closet': 'My Closet', 'upload': 'Add New Garment' };
      document.getElementById('headerTitle').innerText = titles[tabName];

      if (tabName === 'closet') renderCloset();
    }

    // --- IMAGE PREVIEW & BASE64 CONVERSION ---
    function previewImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        currentBase64Image = e.target.result;
        const imgEl = document.getElementById('imagePreview');
        imgEl.src = currentBase64Image;
        imgEl.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    // --- SAVE ITEM TO LOCAL STORAGE ---
    function saveItem() {
      const name = document.getElementById('itemName').value.trim();
      const category = document.getElementById('itemCategory').value;
      const weather = document.getElementById('itemWeather').value;
      const mood = document.getElementById('itemMood').value;

      if (!currentBase64Image) {
        alert('Please select or take a photo of your clothing item first.');
        return;
      }
      if (!name) {
        alert('Please type a name for this item.');
        return;
      }

      const newItem = {
        id: Date.now(),
        name,
        category,
        weather,
        mood,
        image: currentBase64Image
      };

      wardrobe.push(newItem);
      localStorage.setItem('my_wardrobe_items', JSON.stringify(wardrobe));

      // Reset Form
      document.getElementById('itemName').value = '';
      document.getElementById('fileInput').value = '';
      document.getElementById('imagePreview').style.display = 'none';
      currentBase64Image = '';

      alert('Item added to your wardrobe!');
      switchTab('closet', document.querySelectorAll('.nav-item')[1]);
    }

    // --- RENDER CLOSET GRID ---
    function renderCloset() {
      const grid = document.getElementById('closetGrid');
      const countEl = document.getElementById('itemCount');
      grid.innerHTML = '';
      countEl.innerText = `${wardrobe.length} items`;

      if (wardrobe.length === 0) {
        grid.innerHTML = `<p style="grid-column: span 2; color: var(--secondary-text); text-align: center; padding: 20px 0;">Your wardrobe is empty.<br>Tap "Add Item" to start!</p>`;
        return;
      }

      wardrobe.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <button class="delete-btn" onclick="deleteItem(${item.id})">✕</button>
          <img src="${item.image}" alt="${item.name}">
          <div class="item-info">
            <div class="item-title">${item.name}</div>
            <div class="item-tag">${item.category.toUpperCase()} • ${item.weather}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // --- DELETE ITEM ---
    function deleteItem(id) {
      wardrobe = wardrobe.filter(item => item.id !== id);
      localStorage.setItem('my_wardrobe_items', JSON.stringify(wardrobe));
      renderCloset();
    }

    // --- GENERATE OUTFIT ALGORITHM ---
    function generateOutfit() {
      const targetWeather = document.getElementById('weatherSelect').value;
      const targetMood = document.getElementById('moodSelect').value;
      const resultsDiv = document.getElementById('outfitResults');

      if (wardrobe.length === 0) {
        resultsDiv.innerHTML = `<p style="color: var(--danger); text-align: center;">Please add clothes to your wardrobe tab first before generating an outfit.</p>`;
        return;
      }

      // Filter function matching weather/all and mood
      const filterItem = (cat) => {
        let pool = wardrobe.filter(i => i.category === cat);
        // Filter weather
        let weatherMatches = pool.filter(i => i.weather === targetWeather || i.weather === 'all');
        if (weatherMatches.length > 0) pool = weatherMatches;
        
        // Filter mood
        let moodMatches = pool.filter(i => i.mood === targetMood);
        if (moodMatches.length > 0) pool = moodMatches;

        return pool.length > 0 ? pool[Math.floor(Math.random() * pool.length)] : null;
      };

      const top = filterItem('top');
      const bottom = filterItem('bottom');
      const shoes = filterItem('shoes');
      const outerwear = targetWeather === 'cold' ? filterItem('outerwear') : null;

      if (!top && !bottom) {
        resultsDiv.innerHTML = `<p style="color: var(--secondary-text); text-align: center;">Not enough items matching this filter. Try adding more tops and bottoms!</p>`;
        return;
      }

      let html = '<div class="outfit-display">';
      [top, outerwear, bottom, shoes].forEach(item => {
        if (item) {
          html += `
            <div class="outfit-slot">
              <img src="${item.image}">
              <div class="outfit-slot-info">
                <div style="font-size:0.75rem; color:var(--primary); font-weight:700;">${item.category.toUpperCase()}</div>
                <div style="font-weight:600;">${item.name}</div>
              </div>
            </div>
          `;
        }
      });
      html += '</div>';

      resultsDiv.innerHTML = html;
    }
  </script>
</body>
</html>
